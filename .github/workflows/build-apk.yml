name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generar APK de Club Memoria
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar carpeta web www
        run: |
          mkdir -p www
          cp -r index.html styles.css app.js manifest.json sw.js icon-192.png icon-512.png games www/

      - name: Instalar dependencias
        run: |
          npm install

      - name: Crear proyecto Android
        run: |
          npx cap add android

      - name: Actualizar icono en Android
        run: |
          find android/app/src/main/res/ -name "ic_launcher*.png" -exec cp icon-512.png {} \; 2>/dev/null || true

      - name: Sincronizar archivos web
        run: |
          npx cap sync android

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Club-Memoria-v1.0.apk

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Club-Memoria-APK
          path: Club-Memoria-v1.0.apk
          retention-days: 30

      - name: Publicar APK en GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --repo ${{ github.repository }} --yes 2>/dev/null || true
          git tag -d v1.0.0 2>/dev/null || true
          gh release create v1.0.0 Club-Memoria-v1.0.apk \
            --title "Club Memoria v1.0 — APK para Android" \
            --notes "¡Descarga directa del APK de Club Memoria para teléfonos y tablets Android! Desarrollado por Echomaii Corp para Chio." \
            --repo ${{ github.repository }} || true
